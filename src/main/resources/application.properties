spring.application.name=beed

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mobilestoredb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:root}


# ===============================
# 3. JPA & HIBERNATE SETTINGS
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# 4. THYMELEAF SETTINGS
# ===============================
spring.thymeleaf.cache=false

# ===============================
# 5. FILE UPLOAD SETTINGS (For Images)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# L2 Cache Enable karna
spring.jpa.properties.hibernate.cache.use_second_level_cache=true

# Region Factory set karna (Ehcache ke liye)
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory

# Query Cache (findAll query ko cache karne ke liye)
spring.jpa.properties.hibernate.cache.use_query_cache=true

# Provider ki configuration
spring.cache.type=jcache

spring.jpa.properties.hibernate.generate_statistics=true
# Ehcache config file ka path set karna
spring.cache.jcache.config=classpath:ehcache.xml

