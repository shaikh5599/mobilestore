<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Checkout - Mobile Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .checkout-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
            padding: 25px;
        }

        /* Modern Input Styling (Consistent with Login/Register) */
        .form-control {
            border-radius: 12px;
            height: 55px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 16px;
        }
        
        textarea.form-control {
            height: auto !important; /* Textarea ke liye height auto rakhi hai */
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #1a375d;
            box-shadow: 0 0 0 4px rgba(26, 55, 93, 0.1);
        }

        .form-floating label {
            color: #64748b;
            padding-left: 15px;
        }

        /* Payment Method Card */
        .payment-card {
            border: 2px solid #10b981; /* Success green border */
            background-color: #ecfdf5;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* --- STRICT MOBILE RESPONSIVE CSS --- */
        @media (max-width: 768px) {
            body { 
                padding-bottom: 120px !important; /* Sticky bar ke liye jagah */
            }
            .checkout-card {
                padding: 15px;
                border-radius: 12px;
            }
            
            /* Magic: Mobile Sticky Place Order Bar */
            .mobile-place-order-bar {
                position: fixed;
                bottom: 65px !important; /* STRICT FIX: Bottom Nav ke upar baith jayega */
                left: 0;
                width: 100%;
                background: white;
                padding: 15px 20px;
                box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
                z-index: 1000;
                border-top: 1px solid #e2e8f0;
            }

            .desktop-btn { display: none !important; } /* Desktop button mobile pe hide */
        }

        @media (min-width: 769px) {
            .mobile-place-order-bar { display: none !important; }
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: header}"></div>

    <div class="container my-4 my-md-5">
        
        <h3 class="fw-bold text-dark mb-4 px-2 px-md-0"><i class="fas fa-lock text-success me-2"></i> Secure Checkout</h3>

        <div class="row">
            <div class="col-lg-8 mb-4">
                <div class="checkout-card">
                    <h5 class="fw-bold border-bottom pb-3 mb-4"><i class="fas fa-map-marker-alt text-danger me-2"></i> Delivery Address</h5>
                    
                    <form th:action="@{/place-order}" method="post" id="checkoutForm">
                        
                        <div class="form-floating mb-3">
                            <input type="text" name="fullName" class="form-control" id="floatingName" placeholder="John Doe" required>
                            <label for="floatingName">Full Name</label>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="john@example.com" required>
                                    <label for="floatingEmail">Email Address</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating">
                                    <input type="tel" name="mobileNumber" class="form-control" id="floatingMobile" placeholder="9876543210" pattern="[0-9]{10}" title="Enter 10 digit mobile number" required>
                                    <label for="floatingMobile">Mobile Number</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-floating mb-3">
                            <textarea name="address" class="form-control" id="floatingAddress" placeholder="Flat No, Building, Area" style="height: 100px" required></textarea>
                            <label for="floatingAddress">Full Address (Flat No, Building, Area)</label>
                        </div>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <div class="form-floating">
                                    <input type="text" name="city" class="form-control" id="floatingCity" placeholder="City" required>
                                    <label for="floatingCity">City</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-floating">
                                    <input type="text" name="pincode" class="form-control" id="floatingPin" placeholder="Pincode" pattern="[0-9]{6}" title="Enter 6 digit pincode" required>
                                    <label for="floatingPin">Pincode</label>
                                </div>
                            </div>
                        </div>

                        <h5 class="fw-bold border-bottom pb-3 mb-3 mt-4"><i class="fas fa-wallet text-primary me-2"></i> Payment Method</h5>
                        <div class="payment-card mb-4">
                            <i class="fas fa-money-bill-wave fs-2 text-success"></i>
                            <div>
                                <h6 class="fw-bold mb-0">Cash on Delivery (COD)</h6>
                                <span class="text-muted" style="font-size: 13px;">Pay when you receive your order</span>
                            </div>
                            <i class="fas fa-check-circle fs-4 text-success ms-auto"></i>
                        </div>

                        <button type="submit" class="btn btn-warning desktop-btn w-100 py-3 fw-bold fs-5 rounded-3 shadow-sm mt-2">
                            Confirm & Place Order <i class="fas fa-arrow-right ms-2"></i>
                        </button>

                        <div class="mobile-place-order-bar">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="text-muted fw-bold" style="font-size: 14px;">Amount to Pay</span>
                                <span class="fs-4 fw-bold text-dark" th:text="'₹' + ${grandTotal}">₹0</span>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold py-3 fs-5 shadow-sm" style="border-radius: 8px;">
                                Place Order <i class="fas fa-check-circle ms-1"></i>
                            </button>
                        </div>

                    </form>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="checkout-card position-sticky" style="top: 100px;">
                    <h5 class="fw-bold mb-4 border-bottom pb-2">Order Summary</h5>
                    
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>Total Items</span>
                        <span class="fw-bold text-dark" th:text="${globalCartCount}">0</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>Delivery Charges</span>
                        <span class="text-success fw-bold">FREE</span>
                    </div>
                    
                    <div class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center bg-light p-3 rounded-3">
                        <span class="fs-5 fw-bold text-dark">Total Amount</span>
                        <span class="fs-4 fw-bold text-primary" th:text="'₹' + ${grandTotal}">₹0</span>
                    </div>
                    
                    <div class="text-center mt-4">
                        <i class="fas fa-shield-alt text-success fs-3 mb-2"></i>
                        <p class="text-muted small fw-bold mb-0">Safe & Secure Checkout</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
