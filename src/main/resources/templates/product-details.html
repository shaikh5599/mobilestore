<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${product.name} + ' - Mobile Store'">Product Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .main-content { flex: 1 0 auto; }
        .product-image-container { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e2e8f0; text-align: center; }
        .main-image { max-height: 400px; object-fit: contain; width: 100%; transition: transform 0.3s; }
        .main-image:hover { transform: scale(1.05); } 
        .thumbnail-img { width: 70px; height: 70px; object-fit: contain; border: 1px solid #ddd; border-radius: 8px; padding: 5px; cursor: pointer; margin-right: 10px; transition: 0.2s; }
        .thumbnail-img:hover { border-color: #0dcaf0; transform: translateY(-2px); }
        .storage-box { display: inline-block; padding: 8px 15px; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; margin-right: 10px; font-weight: bold; transition: 0.2s; }
        .storage-box.active { border-color: #1a375d; color: #1a375d; background: #e0f2fe; }
        .trust-icon { text-align: center; font-size: 12px; color: #555; }
        .trust-icon i { font-size: 24px; color: #0dcaf0; margin-bottom: 5px; display: block; }

        @media (max-width: 768px) {
            .main-content { padding-bottom: 140px !important; }
            .main-image { max-height: 250px !important; }
            .trust-icon i { font-size: 20px !important; }
            .trust-icon span { font-size: 10px !important; }
            .mobile-action-bar { position: fixed; bottom: 65px !important; left: 0; width: 100%; background: white; padding: 12px 15px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); z-index: 9999; margin: 0 !important; display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; gap: 12px; }
            .mobile-action-bar .action-col { flex: 1; }
            .mobile-qty { display: none !important; }
            .related-scroll { display: flex; overflow-x: auto; flex-wrap: nowrap; gap: 15px; padding-bottom: 15px; scroll-snap-type: x mandatory; }
            .related-scroll::-webkit-scrollbar { display: none; }
            .related-scroll .col-md-3 { flex: 0 0 65%; max-width: 65%; scroll-snap-align: start; }
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: header}"></div>

    <div class="main-content">
        <div class="container my-4 my-md-5">
            
            <nav aria-label="breadcrumb" class="d-none d-md-block"> 
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/">Home</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{'/category/' + ${product.category.id}}" 
                           th:text="${product.category != null ? product.category.name : 'Smartphones'}">Category</a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Mobile</li>
                </ol>
            </nav>

            <div th:if="${session != null and session.errorMsg != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${session.errorMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="row bg-white p-3 p-md-4 rounded-4 shadow-sm border mx-0">
                
                <div class="col-md-5 mb-4 mb-md-0">
                    <div class="product-image-container position-relative">
<img th:src="${product.imageUrl}" class="main-image" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">                    </div>
                </div>

                <div class="col-md-7 ps-md-5">
                    
                    <p class="text-muted fw-bold mb-1" th:text="${product.brand}">Brand Name</p>
                    <h2 class="fw-bold text-dark mb-2 fs-3" th:text="${product.title}">Product Full Title</h2>

                    <div class="mb-4">
                        <span class="fs-2 fw-bold text-dark me-2" th:text="'₹' + ${product.price}">₹0</span>
                        <span class="text-muted text-decoration-line-through fs-5" th:if="${product.mrp != null && product.mrp > product.price}" th:text="'₹' + ${product.mrp}">₹0</span>
                        
                        <p class="text-success fw-bold mt-1 mb-0" th:if="${product.inStock && product.stock != null && product.stock > 0}"><i class="fas fa-check-circle me-1"></i> In Stock</p>
                        <p class="text-danger fw-bold mt-1 mb-0" th:unless="${product.inStock && product.stock != null && product.stock > 0}"><i class="fas fa-times-circle me-1"></i> Out of Stock</p>
                    </div>

                    <div class="mb-4" th:if="${product.storage != null && product.storage != ''}">
                        <p class="fw-bold mb-2 text-dark">Select Variant:</p>
                        
                        <div class="storage-box" 
                             th:each="variant, iterStat : ${#strings.arraySplit(product.storage, ',')}" 
                             th:classappend="${iterStat.index == 0} ? 'active' : ''"
                             th:data-variant="${variant.trim()}"
                             onclick="selectVariant(this, this.getAttribute('data-variant'))"
                             th:text="${variant.trim()}">
                        </div>
                    </div>

                    <form th:action="@{'/cart/add/' + ${product.id}}" method="post" class="mt-4">
                        
                        <input type="hidden" name="selectedVariant" id="selectedVariantInput" 
                               th:value="${(product.storage != null and product.storage != '') ? #strings.arraySplit(product.storage, ',')[0].trim() : ''}">

                        <div class="d-flex align-items-center gap-3 mb-4 mobile-qty">
                            <label class="fw-bold">Quantity:</label>
                            <input type="number" name="quantity" value="1" min="1" 
                                   th:max="${product.stock}" 
                                   th:disabled="${product.stock == null || product.stock <= 0}"
                                   class="form-control text-center" style="width: 80px;">
                        </div>

                        <div class="mobile-action-bar">
                            <div class="action-col">
                                <button type="submit" class="btn w-100 fw-bold py-3 text-dark shadow-sm" 
                                        style="border-radius: 8px; border: 1px solid #ccc; background-color: #ffffff; font-size: 15px;" 
                                        th:disabled="${!product.inStock || product.stock == null || product.stock <= 0}">
                                    <i class="fas fa-cart-plus me-1"></i> Add to Cart
                                </button>
                            </div>
                            <div class="action-col">
                                <button type="submit" th:formaction="@{'/order/buy-now/' + ${product.id}}" 
                                        class="btn w-100 fw-bold py-3 shadow-sm" 
                                        style="border-radius: 8px; background-color: #ff9f00; color: white; border: none; font-size: 15px;" 
                                        th:disabled="${!product.inStock || product.stock == null || product.stock <= 0}">
                                    <i class="fas fa-bolt me-1"></i> Buy Now
                                </button>
                            </div>
                        </div>
                    </form>
                    
                </div> 
            </div> 
        </div> 
    </div> 
    
    <div th:replace="~{fragments/footer :: footer}"></div> 

    <script>
        function selectVariant(element, variantValue) {
            document.querySelectorAll('.storage-box').forEach(box => box.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('selectedVariantInput').value = variantValue;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
