<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Mobile Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <div th:replace="~{fragments/navbar :: header}"></div>

    <div class="container my-5 flex-grow-1">
        
        <div class="text-center mb-5">
            <h2 class="fw-bold text-uppercase border-bottom border-3 border-primary d-inline-block pb-2">Get In Touch</h2>
            <p class="text-muted mt-2">Any questions or remarks? Just write us a message!</p>
        </div>

        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 h-100 text-white" style="background-color: #1a375d;">
                    <div class="card-body p-4 p-md-5">
                        <h4 class="fw-bold mb-4">Contact Information</h4>
                        <p class="mb-4 text-white-50">Fill up the form and our team will get back to you within 24 hours.</p>

                        <div class="d-flex align-items-center mb-4">
                            <i class="fas fa-phone-alt fs-4 text-info me-3"></i>
                            <span th:text="${store != null ? store.contactNo : '+91 9876543210'}">+91 9876543210</span>
                        </div>
                        
                        <div class="d-flex align-items-center mb-4">
                            <i class="fas fa-envelope fs-4 text-info me-3"></i>
                            <span th:text="${store != null ? store.storeEmail : 'support@shop.com'}">support@shop.com</span>
                        </div>
                        
                        <div class="d-flex align-items-center mb-5">
                            <i class="fas fa-map-marker-alt fs-4 text-info me-3"></i>
                            <span th:text="${store != null ? store.address : 'Main Market, City Name'}">Main Market, City Name</span>
                        </div>

                        <div class="d-flex gap-3 mt-auto">
                            <a th:href="${store?.facebookUrl}" target="_blank" class="btn btn-outline-info rounded-circle" style="width: 40px; height: 40px; padding: 7px;">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a th:href="${store?.instagramUrl}" target="_blank" class="btn btn-outline-info rounded-circle" style="width: 40px; height: 40px; padding: 7px;">
                                <i class="fab fa-instagram"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4 p-md-5">
                        
                        <form th:action="@{/submit-contact}" method="post">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-muted small">Full Name</label>
                                    <input type="text" name="name" class="form-control bg-light border-0 py-2" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold text-muted small">Email Address</label>
                                    <input type="email" name="email" class="form-control bg-light border-0 py-2" placeholder="john@example.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted small">Subject</label>
                                <input type="text" name="subject" class="form-control bg-light border-0 py-2" placeholder="What is this regarding?">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-muted small">Message</label>
                                <textarea name="message" class="form-control bg-light border-0 py-2" rows="4" placeholder="Write your message here..." required></textarea>
                            </div>

                            <div class="text-end">
                                <button type="submit" class="btn fw-bold px-5 py-2 text-white shadow-sm" style="background-color: #ff9f00; border-radius: 8px;">
                                    Send Message <i class="fas fa-paper-plane ms-2"></i>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
