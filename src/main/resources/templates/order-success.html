<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Successful - Mobile Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        .success-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
            padding: 40px 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Magic Pop-in Animation for the Checkmark */
        .icon-wrapper {
            color: #10b981; /* Success Green */
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Order ID Highlight Box */
        .order-id-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;
            border: 2px dashed #cbd5e1;
            margin: 25px 0;
            display: inline-block;
            width: 100%;
        }

        .btn-action {
            height: 55px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        /* STRICT MOBILE RESPONSIVE CSS */
        @media (max-width: 768px) {
            body { 
                padding-bottom: 90px !important; 
                background-color: #ffffff; /* Mobile pe clean white look */
            }
            .success-card {
                box-shadow: none; /* Shadow hata di taaki native screen lage */
                border: none;
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/navbar :: header}"></div>

    <div class="container my-5 text-center px-3">
        
        <div class="success-card">
            
            <div class="icon-wrapper">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h2 class="fw-bold text-dark mb-2">Order Confirmed!</h2>
            <p class="text-muted fs-6 mb-0">Aapka order successfully place ho gaya hai.</p>
            <p class="text-muted fs-6">Jald hi aapko delivery update mil jayega.</p>
            
            <div class="order-id-box">
                <span class="text-secondary fw-bold" style="font-size: 14px;">ORDER ID</span><br>
                <span class="fs-4 fw-bold text-primary">#<span th:text="${orderId}">0</span></span>
            </div>
            
            <div class="row g-3 mt-2">
                <div class="col-12">
                    <a href="/my-orders" class="btn btn-warning w-100 btn-action shadow-sm">
                        <i class="fas fa-box"></i> View My Orders
                    </a>
                </div>
                <div class="col-12">
                    <a href="/" class="btn btn-outline-dark w-100 btn-action">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </a>
                </div>
            </div>

        </div>
        
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
