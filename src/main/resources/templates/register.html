<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Mobile Store</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            background: #f4f7fa; 
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 15px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .auth-header h2 { font-weight: 800; color: #1a375d; margin-bottom: 5px; }
        .auth-header p { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        .input-group {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 18px;
            transition: 0.3s;
        }

        .input-group:focus-within {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13,110,253,0.1);
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding-left: 15px;
        }

        .form-control {
            background: transparent;
            border: none;
            padding: 12px 15px 12px 5px;
            font-size: 15px;
            font-weight: 500;
        }

        .form-control:focus { 
            background: transparent; 
            box-shadow: none; 
        }

        .btn-register {
            background: #1a375d;
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-register:active { 
            transform: scale(0.97); 
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
        }

        .footer-text a { 
            color: #0d6efd; 
            text-decoration: none; 
            font-weight: 700; 
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header text-center">
            <h2>Join Us!</h2>
            <p>Create your account to start shopping.</p>
        </div>

        <div th:if="${succMsg}" class="alert alert-success py-2 text-center small" th:text="${succMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-danger py-2 text-center small" th:text="${errorMsg}"></div>

        <form th:action="@{/register}" method="post">
            
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="name" class="form-control" placeholder="Full Name" required />
            </div>

            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Email Address" required />
            </div>

            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                <input type="number" name="mobileNumber" class="form-control" placeholder="Mobile Number" required />
            </div>

            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-city"></i></span>
                <input type="text" name="city" class="form-control" placeholder="City" required />
            </div>

            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                <input type="text" name="state" class="form-control" placeholder="State" required />
            </div>

            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Create Password" required />
            </div>

            <input type="hidden" name="role" value="ROLE_USER" />

            <button type="submit" class="btn btn-register shadow-sm">
                Register Account
            </button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="/login">Login Here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
