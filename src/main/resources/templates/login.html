<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - Mobile Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        .login-container {
            max-width: 450px;
            margin: auto;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background: white;
            padding: 30px 20px;
        }

        /* Modern Input Styling */
        .form-control {
            border-radius: 12px;
            height: 55px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            font-size: 16px;
        }
        
        .form-control:focus {
            background-color: #ffffff;
            border-color: #1a375d;
            box-shadow: 0 0 0 4px rgba(26, 55, 93, 0.1);
        }

        /* Floating Label Adjustments */
        .form-floating label {
            color: #64748b;
            padding-left: 15px;
        }

        .btn-login {
            background-color: #1a375d;
            color: white;
            border-radius: 12px;
            height: 55px;
            font-size: 18px;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-login:hover {
            background-color: #0f2545;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(26, 55, 93, 0.3);
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: #e0f2fe;
            color: #0284c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
        }

        /* Mobile specific fixes */
        @media (max-width: 768px) {
            body { 
                padding-bottom: 90px !important; 
                background-color: #ffffff; 
            }
            .login-card {
                box-shadow: none; 
                padding: 10px;
            }
            .login-container {
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>
    
    <div th:replace="~{fragments/navbar :: header}"></div>

    <div class="container login-container my-4 my-md-5">
        
        <div class="login-card">
            
            <div class="text-center mb-4">
                <div class="icon-circle">
                    <i class="fas fa-user-lock"></i>
                </div>
                <h3 class="fw-bold text-dark">Welcome Back!</h3>
                <p class="text-muted">Login to continue shopping</p>
            </div>

            <div th:if="${succMsg}" class="alert alert-success border-0 rounded-3 d-flex align-items-center mb-4 shadow-sm" role="alert">
                <i class="fas fa-check-circle fs-5 me-2"></i>
                <div th:text="${succMsg}"></div>
            </div>

            <div th:if="${param.error}" class="alert alert-danger border-0 rounded-3 d-flex align-items-center mb-4 shadow-sm" role="alert">
                <i class="fas fa-exclamation-triangle fs-5 me-2"></i>
                <div>Invalid Email or Password.</div>
            </div>

            <div th:if="${param.logout}" class="alert alert-info border-0 rounded-3 d-flex align-items-center mb-4 shadow-sm" role="alert">
                <i class="fas fa-info-circle fs-5 me-2"></i>
                <div>You have been logged out successfully.</div>
            </div>

            <form action="/login" method="post">
                
                <div class="form-floating mb-3">
                    <input type="email" name="username" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                    <label for="floatingEmail"><i class="far fa-envelope me-2"></i>Email address</label>
                </div>
                
                <div class="form-floating mb-2">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                    <label for="floatingPassword"><i class="fas fa-lock me-2"></i>Password</label>
                </div>

                <button type="submit" class="btn btn-login w-100 fw-bold shadow-sm">
                    Login
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">Don't have an account?</p>
                <a href="/register" class="btn btn-outline-dark w-100 mt-2 fw-bold" style="border-radius: 12px; height: 50px; line-height: 35px;">
                    Create New Account
                </a>
            </div>

        </div>
        
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
