<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Orders - Mobile Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { 
            background-color: #f8fafc; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
        }
        .card-custom { 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            background: #fff; 
            transition: transform 0.2s;
        }
        .card-custom:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1); 
        }
        .badge-custom { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 13px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="container my-4 my-md-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0"><i class="fas fa-shopping-bag text-primary me-2"></i> My Orders</h3>
        <a href="/" class="btn btn-outline-primary btn-sm rounded-pill fw-bold">Continue Shopping</a>
    </div>

    <div th:if="${succMsg}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-check-circle me-2"></i><span th:text="${succMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${orders == null or orders.isEmpty()}" class="text-center py-5 bg-white rounded-4 shadow-sm border">
        <i class="fas fa-box-open text-muted mb-3" style="font-size: 60px;"></i>
        <h4 class="text-muted fw-bold">You haven't placed any orders yet.</h4>
        <p class="text-secondary">Looks like you haven't made your choice yet.</p>
    </div>

    <div class="row">
        <div class="col-12" th:each="o : ${orders}">
            <div class="card card-custom mb-3 border">
                <div class="card-body p-4 d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3">
                    
                    <div>
                        <h6 class="fw-bold text-dark mb-1">Tracking ID: #MS-[[${o.id}]]</h6>
                        <small class="text-muted"><i class="far fa-calendar-alt me-1"></i> <span th:text="${#temporals.format(o.orderDate, 'dd-MMM-yyyy hh:mm a')}"></span></small>
                    </div>
                    
                    <div>
                        <span th:if="${#strings.equalsIgnoreCase(o.status, 'Pending')}" class="badge-custom bg-info text-white">
                            <i class="fas fa-clock me-1"></i> Pending
                        </span>
                        
                        <span th:if="${#strings.equalsIgnoreCase(o.status, 'Success') or #strings.equalsIgnoreCase(o.status, 'Delivered')}" class="badge-custom bg-success text-white">
                            <i class="fas fa-check-circle me-1"></i> Success
                        </span>
                        
                        <span th:if="${#strings.equalsIgnoreCase(o.status, 'Shipped')}" class="badge-custom bg-warning text-dark">
                            <i class="fas fa-truck me-1"></i> Shipped
                        </span>

                        <span th:if="${#strings.equalsIgnoreCase(o.status, 'Cancelled')}" class="badge-custom bg-danger text-white">
                            <i class="fas fa-times-circle me-1"></i> Cancelled
                        </span>
                    </div>

                    <div>
                        <span class="text-muted small d-block mb-1">Total Amount</span>
                        <h5 class="fw-bold text-success mb-0" th:text="'₹' + ${o.totalAmount}">₹0</h5>
                    </div>

                    <div>
                        <a th:href="@{'/order-details/' + ${o.id}}" class="btn btn-outline-primary rounded-pill fw-bold px-4">
                            View Details <i class="fas fa-chevron-right ms-1" style="font-size: 12px;"></i>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
