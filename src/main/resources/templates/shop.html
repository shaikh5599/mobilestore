<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title th:text="${pageTitle != null ? pageTitle : (categoryName != null ? categoryName : 'Shop - Royel Shop')}">Shop</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #f8fafc; }
        
        .product-card { 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            border: 1px solid #e2e8f0; 
        }
        .product-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important; 
        }
        
        .card-img-top { 
            height: 200px; 
            object-fit: contain; 
            padding: 15px; 
            background-color: #ffffff; 
        }
        
        .mobile-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 48px; 
            white-space: normal;
        }

        @media (max-width: 768px) {
            body { padding-bottom: 70px !important; } 
            
            .mobile-grid-row { margin-left: -5px; margin-right: -5px; }
            .mobile-grid-col { padding-left: 5px; padding-right: 5px; margin-bottom: 10px !important; }
            
            .card-body { padding: 10px !important; }
            .card-img-top { height: 120px !important; padding: 5px; }
            
            .mobile-title { font-size: 13px !important; height: 38px; margin-bottom: 5px !important; }
            .mobile-price { font-size: 15px !important; margin-bottom: 8px !important;}
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0" th:text="${categoryName != null ? categoryName : 'All Products'}">All Products</h3>
        <span class="text-muted fw-bold" th:text="${products.size()} + ' Items'">0 Items</span>
    </div>

    <div th:if="${products.empty}" class="text-center py-5">
        <i class="fas fa-box-open text-muted mb-3" style="font-size: 50px;"></i>
        <h4 class="text-muted fw-bold">No products found in this category.</h4>
        <a href="/" class="btn btn-primary mt-3 rounded-pill px-4 fw-bold">Back to Home</a>
    </div>

    <div class="row mobile-grid-row" th:if="${!products.empty}">
        <div class="col-6 col-md-4 col-lg-3 mobile-grid-col mb-4" th:each="p : ${products}">
            <div class="card product-card h-100 rounded-4 overflow-hidden">
                <a th:href="@{'/product/detail/' + ${p.id}}">
                    <img th:src="${not #strings.isEmpty(p.imageUrl)} ? ${p.imageUrl} : 'https://via.placeholder.com/250?text=No+Image'" 
                         class="card-img-top" 
                         alt="Product Image"
                         onerror="this.src='https://via.placeholder.com/250?text=No+Image'">
                </a>
                
                <div class="card-body d-flex flex-column text-center">
                    <h6 class="card-title fw-bold text-dark mobile-title">
                        <a th:href="@{'/product/detail/' + ${p.id}}" class="text-decoration-none text-dark" th:text="${p.name}">Product Name</a>
                    </h6>
                    
                    <div class="mt-auto">
                        <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
                            <span class="fs-5 fw-bold text-dark mobile-price" th:text="'₹' + ${p.price}">₹0</span>
                            <span class="text-muted text-decoration-line-through small" th:if="${p.mrp != null && p.mrp > p.price}" th:text="'₹' + ${p.mrp}">₹0</span>
                        </div>
                        
                        <form th:action="@{'/cart/add/' + ${p.id}}" method="post" class="m-0">
                            <input type="hidden" name="quantity" value="1" />
                            <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill shadow-sm" style="font-size: 14px;">
                                <i class="fas fa-cart-plus me-1"></i> Add
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
