<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div th:replace="~{admin/fragments/sidebar :: sidebar-css}"></div>

<style>
/* Dashboard ki special CSS */
body { background: #eef2f7; font-family: Arial, sans-serif; }

/* TOP HEADER (Isko 250px kiya taaki sidebar se na takraye) */
.top-header {
    position: fixed;
    top: 0;
    left: 250px; 
    right: 0;
    height: 70px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 100;
}

.search-box input { width: 400px; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; }
.header-icons { display: flex; gap: 20px; align-items: center; font-size: 20px; cursor: pointer; }

/* OVERVIEW CARDS */
.cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-bottom: 25px; }
.card { color: white; padding: 20px; border-radius: 10px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.card h3 { margin-bottom: 10px; font-size: 18px; font-weight: normal; }
.card p { font-size: 28px; font-weight: bold; margin: 0; }

.green { background: #34a853; }
.blue { background: #4285f4; }
.orange { background: #f9a825; }
.red { background: #ea4335; }

/* TABLE BOX */
.table-box { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 25px; }
.table-controls { display: flex; justify-content: space-between; margin-bottom: 15px; }
.table-controls input, .table-controls select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
.export-btn { background: #0d6efd; color: white; padding: 10px 15px; border: none; border-radius: 6px; }

table { width: 100%; border-collapse: collapse; }
table th, table td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }

.status { padding: 6px 10px; border-radius: 6px; color: white; font-size: 13px; }
.processing { background: #f9a825; }
.shipped { background: #4285f4; }
.delivered { background: #34a853; }
.cancelled { background: #ea4335; }

.action-btn { padding: 6px 10px; border: none; border-radius: 4px; color: white; margin-right: 5px; font-size: 13px; }
.edit { background: #0d6efd; }
.delete { background: #ea4335; }

/* BOTTOM STATS */
.bottom-stats { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
.stats-box, .quick-box { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.stats-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 20px; margin-top: 15px; }
.stats-item { text-align: center; }
.stats-item h2 { color: #0d6efd; margin-bottom: 5px; }
.stats-item p { margin: 0; color: #666; }

@media(max-width:992px){
    .cards { grid-template-columns: repeat(2,1fr); }
    .bottom-stats { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2,1fr); }
    .search-box input { width: 250px; }
}
</style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('dashboard')}"></div>

<div class="top-header">
    <div class="search-box">
        <input type="text" placeholder="Search orders, products...">
    </div>
    <div class="header-icons">
        <i class="fas fa-bell text-muted"></i>
        <span class="fs-6 fw-bold"><i class="fas fa-user-circle me-1"></i> Admin</span>
    </div>
</div>

<div class="main-content" style="padding-top: 100px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 fw-bold text-dark">Admin Dashboard</h2>
    </div>

    <div class="cards">
        <div class="card green">
            <p>₹<span th:text="${totalAmount != null ? totalAmount : '0.00'}">0.00</span></p>
        </div>
        <div class="card blue">
            <h3>New Orders</h3>
            <p th:text="${totalOrders != null ? totalOrders : '0'}">0</p>
        </div>
        <div class="card orange">
            <h3>Total Categories</h3>
            <p th:text="${totalCategories != null ? totalCategories : '0'}">0</p>
        </div>
        <div class="card red">
            <h3>Total Products</h3>
            <p th:text="${totalProducts != null ? totalProducts : '0'}">0</p>
        </div>
    </div>



    <div class="bottom-stats">
        <div class="stats-box">
            <h4 class="fw-bold text-dark mb-3">Order Summary</h4>
            <div class="stats-grid">
                <div class="stats-item">
                    <h2 th:text="${totalOrders != null ? totalOrders : '0'}">0</h2>
                    <p>All Orders</p>
                </div>
            </div>
        </div>
        <div class="quick-box">
            <h4 class="fw-bold text-dark mb-3">Quick Stats</h4>
            <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                <span class="text-muted">Total Products</span>
                <span class="fw-bold" th:text="${totalProducts != null ? totalProducts : '0'}">0</span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted">Total Categories</span>
                <span class="fw-bold" th:text="${totalCategories != null ? totalCategories : '0'}">0</span>
            </div>
        </div>
    </div>
        <div class="table-box">
        <h4 class="mb-3 fw-bold text-dark">Recent Orders</h4>
        <div class="table-controls">
            
        </div>

        <table>
            <thead>
                <tr class="bg-light">
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${recentOrders}">
                    <td th:text="'#' + ${order.id}" class="fw-bold text-primary">#100</td>
                    <td th:text="${order.fullName}">Rahul</td>
                    <td th:text="'₹' + ${order.totalAmount}" class="fw-bold">₹0</td>
                    <td>
                        <span class="status" th:text="${order.status}" th:classappend="${#strings.toLowerCase(order.status)}">Status</span>
                    </td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy')}">Date</td>
                    <td>
                        <button class="action-btn edit"><i class="fas fa-pen"></i></button>
                        <button class="action-btn delete"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentOrders)}">
                    <td colspan="6" class="text-center py-4 text-muted">No recent orders found.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
