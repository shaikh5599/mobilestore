<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Manage Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div th:replace="~{admin/fragments/sidebar :: sidebar-css}"></div>

<style>
body {
    background: #eef2f7;
    font-family: Arial, sans-serif;
}

.top-header {
    position: fixed;
    top: 0;
    left: 250px;
    right: 0;
    height: 70px;
    background: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    z-index: 100;
}

.search-box input {
    width: 400px;
    padding: 10px 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

.header-icons {
    display: flex;
    gap: 20px;
    align-items: center;
    font-size: 20px;
    cursor: pointer;
}

.table-card {
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}

.product-img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 5px;
    border: 1px solid #ddd;
    padding: 2px;
}

.action-btn {
    padding: 6px 10px;
    border: none;
    border-radius: 4px;
    color: white;
    margin-right: 5px;
    font-size: 13px;
}

.edit { background: #0d6efd; }
.delete { background: #ea4335; }
</style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('manage-products')}"></div>

<div class="top-header">
    <div class="search-box">
        <input type="text" placeholder="Search products by name or ID...">
    </div>
    <div class="header-icons">
        <i class="fas fa-bell text-muted"></i>
        <span class="fs-6 fw-bold">
            <i class="fas fa-user-circle me-1"></i> Admin
        </span>
    </div>
</div>

<div class="main-content" style="padding-top: 100px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 fw-bold text-dark">Manage Products</h2>

        <a href="/admin/products/add" class="btn btn-primary fw-bold px-4 py-2 shadow-sm">
            <i class="fas fa-plus me-2"></i> Add New Product
        </a>
    </div>

    <div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong th:text="${session.succMsg}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="table-card">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="p : ${products}">
                    
                    <td class="fw-bold text-primary" th:text="${p.id}">1</td>

                    <td>
                        <img th:src="${not #strings.isEmpty(p.imageUrl)} ? ${p.imageUrl} : 'https://via.placeholder.com/50'"
                             class="product-img"
                             onerror="this.src='https://via.placeholder.com/50'">
                    </td>

                    <td class="fw-bold text-dark" th:text="${p.name}">Samsung Galaxy</td>

                    <td>
                        <span class="badge bg-info text-dark"
                              th:text="${p.category != null ? p.category.name : 'No Category'}">
                            Smartphone
                        </span>
                    </td>

                    <td class="fw-bold text-success" th:text="'₹' + ${p.price}">
                        ₹50000
                    </td>

                    <td>
                        <span th:if="${p.stock != null and p.stock > 0}"
                              class="badge bg-success"
                              th:text="${p.stock} + ' In Stock'">
                        </span>

                        <span th:unless="${p.stock != null and p.stock > 0}"
                              class="badge bg-danger">
                              Out of Stock
                        </span>
                    </td>

                    <td>
                        <a th:href="@{'/admin/products/edit/' + ${p.id}}"
                           class="action-btn edit text-decoration-none">
                            <i class="fas fa-pen"></i>
                        </a>

                        <a th:href="@{'/admin/products/delete/' + ${p.id}}"
                           class="action-btn delete text-decoration-none" onclick="return confirm('Warning: Are you sure you want to delete this product?');">
                            <i class="fas fa-trash"></i>
                        </a>
                    </td>

                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
