<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Categories</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div th:replace="~{admin/fragments/sidebar :: sidebar-css}"></div>

<style>
/* BASE CSS & TOP HEADER */
body { background: #eef2f7; font-family: Arial, sans-serif; }

.top-header {
    position: fixed; top: 0; left: 250px; right: 0; height: 70px;
    background: #fff; display: flex; justify-content: space-between;
    align-items: center; padding: 0 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 100;
}
.search-box input { width: 400px; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; }
.header-icons { display: flex; gap: 20px; align-items: center; font-size: 20px; cursor: pointer; }

/* Content Cards */
.content-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); height: 100%; }
.form-control { border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; }
</style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('categories')}"></div>

<div class="top-header">

    <div class="search-box">
        <input type="text" placeholder="Search categories...">
    </div>
    <div class="header-icons">
        <i class="fas fa-bell text-muted"></i>
        <span class="fs-6 fw-bold"><i class="fas fa-user-circle me-1"></i> Admin</span>
    </div>
</div>

<div class="main-content" style="padding-top: 100px;">
    
    <h2 class="mb-4 fw-bold text-dark">Manage Categories</h2>

    <div th:if="${session.succMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <strong th:text="${session.succMsg}"></strong>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
    </div>

    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="content-card">
                <h5 class="fw-bold mb-4 text-dark"><i class="fas fa-plus-circle text-primary me-2"></i> Add Category</h5>
                <form th:action="@{/admin/categories/add}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary">Category Name</label>
                        <input type="text" name="name" class="form-control" placeholder="E.g. Smartwatch, Earbuds" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        <i class="fas fa-save me-2"></i> Save Category
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="content-card">
                <h5 class="fw-bold mb-4 text-dark"><i class="fas fa-list text-primary me-2"></i> All Categories</h5>
                
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th># ID</th>
                            <th>Category Name</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat, status : ${categories}">
                            <td class="fw-bold text-muted" th:text="${status.count}">1</td>
                            <td th:text="${cat.name}" class="fw-bold text-dark fs-5">Smartphone</td>
                            <td>
                                <button class="btn btn-sm btn-primary me-2" 
                                        th:onclick="openEditModal([[${cat.id}]], [[${cat.name}]])">
                                    <i class="fas fa-edit"></i>
                                </button>
                                
                                <a th:href="@{'/admin/categories/delete/' + ${cat.id}}" 
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Bhai, pakka delete karna hai?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="text-center py-4 text-muted">No categories found. Add a new one!</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content" style="border-radius: 12px;">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Update Category</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/categories/update}" method="post">
                <div class="modal-body">
                    <input type="hidden" name="id" id="editId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">New Category Name</label>
                        <input type="text" name="name" id="editName" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="submit" class="btn btn-primary fw-bold">Update Now</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function openEditModal(id, name) {
        // 1. Modal ke fields mein purana data bharo
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        
        // 2. Modal ko show karo
        var myModal = new bootstrap.Modal(document.getElementById('editModal'));
        myModal.show();
    }
</script>

</body>
</html>
