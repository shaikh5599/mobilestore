<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Manage Customers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div th:replace="~{admin/fragments/sidebar :: sidebar-css}"></div>

<style>
body { background: #eef2f7; font-family: Arial, sans-serif; }

.top-header {
    position: fixed; top: 0; left: 250px; right: 0; height: 70px;
    background: #fff; display: flex; justify-content: space-between;
    align-items: center; padding: 0 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 100;
}
.search-box input { width: 400px; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; }
.header-icons { display: flex; gap: 20px; align-items: center; font-size: 20px; cursor: pointer; }

.table-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

.user-avatar { 
    width: 45px; height: 45px; border-radius: 50%; 
    background: #eef2f7; display: flex; justify-content: center; 
    align-items: center; font-weight: bold; color: #0d6efd; font-size: 18px; 
}

.badge-active { background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 6px; font-weight: bold; }
.badge-blocked { background: #ffebee; color: #c62828; padding: 5px 10px; border-radius: 6px; font-weight: bold; }

.action-btn { padding: 6px 10px; border: none; border-radius: 4px; color: white; margin-right: 5px; font-size: 13px; }
.block-btn { background: #ea4335; }
.mail-btn { background: #0d6efd; }
</style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('customers')}"></div>

<div class="top-header">
    <div class="search-box">
        <input type="text" placeholder="Search customers by name or email...">
    </div>
    <div class="header-icons">
        <i class="fas fa-bell text-muted"></i>
        <span class="fs-6 fw-bold"><i class="fas fa-user-circle me-1"></i> Admin</span>
    </div>
</div>

<div class="main-content" style="padding-top: 100px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 fw-bold text-dark">Registered Customers</h2>
        <span class="text-muted fw-bold">Total: <span th:text="${customers != null ? customers.size() : '0'}">0</span> Customers</span>
    </div>

    <div class="table-card">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Profile</th>
                    <th>Customer Name</th>
                    <th>Contact Details</th>
                    <th>City / State</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${customers}">
                    <td>
                        <div class="user-avatar" th:text="${c.name != null ? #strings.substring(c.name, 0, 1) : 'U'}">R</div>
                    </td>
                    <td class="fw-bold text-dark" th:text="${c.name}">Rahul Kumar</td>
                    <td>
                        <div class="d-flex flex-column">
                            <span th:text="${c.email}">rahul@gmail.com</span>
                            <small class="text-muted" th:text="${c.mobileNumber}">9876543210</small>
                        </div>
                    </td>
                    <td>
                        <span th:text="${c.city != null ? c.city : 'Not Added'}">Kalyan</span>, 
                        <small class="text-muted" th:text="${c.state != null ? c.state : ''}">Maharashtra</small>
                    </td>
                    <td>
                        <span class="badge-active">Active</span>
                    </td>
                    <td>
                        <a th:href="'mailto:' + ${c.email}" class="action-btn mail-btn text-decoration-none" title="Send Email">
                            <i class="fas fa-envelope"></i>
                        </a>
                        <a href="#" class="action-btn block-btn text-decoration-none" title="Block User">
                            <i class="fas fa-ban"></i>
                        </a>
                    </td>
                </tr>
                
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fas fa-users fa-3x mb-3"></i>
                        <p>No registered customers found.</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function(){
  $(".search-box input").on("keyup", function() {
    var value = $(this).val().toLowerCase();
    $("tbody tr").filter(function() {
      $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
    });
  });
});
</script>

</body>
</html>
