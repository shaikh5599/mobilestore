<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Manage Orders</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<div th:replace="~{admin/fragments/sidebar :: sidebar-css}"></div>

<style>
/* 2. BASE CSS & TOP HEADER (Dashboard jaisa same) */
body { background: #eef2f7; font-family: Arial, sans-serif; }

.top-header {
    position: fixed; top: 0; left: 250px; right: 0; height: 70px;
    background: #fff; display: flex; justify-content: space-between;
    align-items: center; padding: 0 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); z-index: 100;
}
.search-box input { width: 400px; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; }
.header-icons { display: flex; gap: 20px; align-items: center; font-size: 20px; cursor: pointer; }

/* Table Design */
.table-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

/* Status Labels (Dashboard wali same styling) */
.status { padding: 6px 12px; border-radius: 6px; color: white; font-size: 13px; font-weight: bold; }
.pending { background: #f9a825; }    /* Orange */
.shipped { background: #4285f4; }    /* Blue */
.delivered { background: #34a853; }  /* Green */
.cancelled { background: #ea4335; }  /* Red */

.action-btn { padding: 6px 10px; border: none; border-radius: 4px; color: white; margin-right: 5px; font-size: 13px; }
.view-btn { background: #0d6efd; }

/* Sab Action buttons ek jaise dikhne chahiye */
.action-btn, .btn-danger {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    text-decoration: none !important;
}

.view-btn { background: #0d6efd; color: white; border: none; }
.view-btn:hover { background: #0b5ed7; color: white; }

.print-btn { background: #dc3545; color: white; border: none; }
.print-btn:hover { background: #bb2d3b; color: white; }
</style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar('orders')}"></div>

<div class="top-header">
    <div class="search-box">
        <input type="text" placeholder="Search orders by ID or Customer name...">
    </div>
    <div class="header-icons">
        <i class="fas fa-bell text-muted"></i>
        <span class="fs-6 fw-bold"><i class="fas fa-user-circle me-1"></i> Admin</span>
    </div>
</div>

<div class="main-content" style="padding-top: 100px;">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="m-0 fw-bold text-dark">Manage Orders</h2>
        <button class="btn btn-outline-primary fw-bold px-4 py-2 shadow-sm bg-white">
            <i class="fas fa-download me-2"></i> Export Report
        </button>
    </div>

    <div th:if="${session.succMsg}" id="success-alert" class="alert alert-success alert-dismissible fade show custom-alert" role="alert">
    <i class="fas fa-check-circle me-2"></i>
    <strong th:text="${session.succMsg}"></strong>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
</div>

    <div class="table-card">
        <table class="table table-hover align-middle">
            <thead class="table-light">
                <tr>
                    <th>Order ID</th>
                    <th>Customer Name</th>
                    <th>Total Amount</th>
                    <th>Order Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}">
                    <td class="fw-bold text-primary" th:text="'#' + ${order.id}">#101</td>
                    <td>
                        <div class="d-flex flex-column">
                            <span class="fw-bold text-dark" th:text="${order.fullName}">John Doe</span>
                            <small class="text-muted" th:text="${order.email}">john@example.com</small>
                        </div>
                    </td>
                    <td class="fw-bold text-dark" th:text="'₹' + ${order.totalAmount}">₹0</td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, HH:mm')}">22 Apr 2026</td>
                    <td>
                        <span class="status" 
                              th:text="${order.status}" 
                              th:classappend="${#strings.toLowerCase(order.status)}">Pending</span>
                    </td>
                    <td>
    <div class="d-flex gap-2">
        <a th:href="@{'/admin/order-details/' + ${order.id}}" class="action-btn view-btn">
            <i class="fas fa-eye"></i> View Detail
        </a>
        <a th:href="@{'/admin/invoice/print/' + ${order.id}}" target="_blank" class="action-btn print-btn">
            <i class="fas fa-file-pdf"></i> Print Invoice
        </a>
    </div>
</td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="fas fa-shopping-basket fa-3x mb-3"></i>
                        <p>Abhi tak koi order nahi aaya hai.</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>

// Jaise hi page load ho, check karo alert hai ya nahi
document.addEventListener("DOMContentLoaded", function() {
    const alert = document.getElementById('success-alert');
    if (alert) {
        // 3000ms (3 second) baad alert ko gayab karo
        setTimeout(function() {
            alert.style.transition = "opacity 0.5s ease";
            alert.style.opacity = "0";
            
            // Opacity khatam hone ke baad element ko remove karo
            setTimeout(() => alert.remove(), 500);
        }, 3000);
    }
});
</script>
</script>
</html>
